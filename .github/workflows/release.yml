name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore EntityEspActPlugin.sln

      - name: Test
        run: dotnet run --project tests/EntityEspActPlugin.Tests/EntityEspActPlugin.Tests.csproj -c Release --no-restore

      - name: Package
        shell: bash
        run: build/package-release.sh

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(cat artifacts/release/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: Entity ESP ACT Plugin ${{ steps.package.outputs.tag }}
          files: artifacts/release/EntityEspActPlugin-${{ steps.package.outputs.tag }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
